spring:
  application:
    name: report-generator

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swasthai_report_generator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:roots}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

security:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:E:/swasthai-secrets/report-generator/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:E:/swasthai-secrets/report-generator/public.pem}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
    issuer: ${JWT_ISSUER:swasthai-report-generator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

bootstrap:
  admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:System Super Admin}

server:
  port: ${SERVER_PORT:8087}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized