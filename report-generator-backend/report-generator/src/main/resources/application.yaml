spring:
  application:
    name: report-generator

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swasthai_report_generator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

security:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
    issuer: ${JWT_ISSUER:swasthai-report-generator}

  rate-limit:
    max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    lock-seconds: ${AUTH_RATE_LIMIT_LOCK_SECONDS:300}
    cleanup-enabled: ${AUTH_RATE_LIMIT_CLEANUP_ENABLED:true}
    cleanup-cron: ${AUTH_RATE_LIMIT_CLEANUP_CRON:0 0 * * * *}
    cleanup-batch-size: ${AUTH_RATE_LIMIT_CLEANUP_BATCH_SIZE:500}
    cleanup-stale-after-seconds: ${AUTH_RATE_LIMIT_CLEANUP_STALE_AFTER_SECONDS:86400}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

bootstrap:
  admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:System Super Admin}

server:
  port: ${SERVER_PORT:8087}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized





report:
  retention:
    delete-after-days: ${REPORT_RETENTION_DELETE_AFTER_DAYS}
    purge-after-days: ${REPORT_RETENTION_PURGE_AFTER_DAYS}
    purge-batch-size: ${REPORT_RETENTION_PURGE_BATCH_SIZE}
    bulk-batch-size: ${REPORT_RETENTION_BULK_BATCH_SIZE:500}
    purge-enabled: ${REPORT_RETENTION_PURGE_ENABLED}
    purge-cron: ${REPORT_RETENTION_PURGE_CRON}
    time-zone: ${REPORT_RETENTION_TIME_ZONE}

license:
  duration-days: ${LICENSE_DURATION_DAYS:365}


storage:
  root-path: ${STORAGE_ROOT_PATH:E:/swasthai-storage/report-generator}
  max-image-size-bytes: ${STORAGE_MAX_IMAGE_SIZE_BYTES:5242880}