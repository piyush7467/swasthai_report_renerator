spring:
  application:
    name: report-generator-test

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${TEST_DB_NAME:swasthai_report_generator_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

security:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:E:/swasthai-secrets/report-generator/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:E:/swasthai-secrets/report-generator/public.pem}
    access-token-expiration-seconds: 900
    issuer: swasthai-report-generator

  rate-limit:
    max-attempts: 5
    window-seconds: 60
    lock-seconds: 300
    cleanup-enabled: false

  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080

bootstrap:
  admin:
    enabled: false

report:
  retention:
    delete-after-days: 5
    purge-after-days: 10
    purge-batch-size: 500
    bulk-batch-size: 500
    purge-enabled: false
    purge-cron: "0 0 * * * *"
    time-zone: Asia/Kolkata

license:
  duration-days: 365

storage:
  root-path: ${STORAGE_ROOT_PATH:E:/swasthai-storage/report-generator}
  max-image-size-bytes: 5242880

staff:
  cleanup:
    enabled: false
    cron: "0 0 2 * * *"
    time-zone: Asia/Kolkata
    retention-days: 10
    batch-size: 50
